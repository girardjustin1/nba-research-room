# League and app settings. Secrets live in .env, never here.

league:
  name: Hoop Dreams
  platform: yahoo
  league_id: 79805
  my_team_id: 11
  teams: 14
  public: false
  format: h2h_one_win          # one W or L per week: majority of the 9 categories

categories:                    # higher_is_better: false means fewer wins the category;
                               # yahoo_stat_id: Yahoo's NBA stat id (standard ids; checked on the first API read)
  - {key: fg_pct, label: FG%,  kind: pct,   made: fgm,  attempts: fga, higher_is_better: true, yahoo_stat_id: 5}
  - {key: ft_pct, label: FT%,  kind: pct,   made: ftm,  attempts: fta, higher_is_better: true, yahoo_stat_id: 8}
  - {key: fg3m,   label: 3PTM, kind: count, higher_is_better: true, yahoo_stat_id: 10}
  - {key: pts,    label: PTS,  kind: count, higher_is_better: true, yahoo_stat_id: 12}
  - {key: reb,    label: REB,  kind: count, higher_is_better: true, yahoo_stat_id: 15}
  - {key: ast,    label: AST,  kind: count, higher_is_better: true, yahoo_stat_id: 16}
  - {key: stl,    label: ST,   kind: count, higher_is_better: true, yahoo_stat_id: 17}
  - {key: blk,    label: BLK,  kind: count, higher_is_better: true, yahoo_stat_id: 18}
  - {key: tov,    label: TO,   kind: count, higher_is_better: false, yahoo_stat_id: 19}

roster:
  slots: [PG, SG, G, SF, PF, F, C, C, Util, Util, BN, BN, IL]   # from Yahoo, 2026-10-04
  active_per_day: 10
  bench: 2                     # the build prompt said 3; Yahoo's roster has 2
  il: 1
  il_direct_add: true          # injured free agents may go straight to IL
  lock: daily_at_game_time     # bench players are not locked

transactions:
  max_acquisitions_per_week: 4
  season_max_acquisitions: null
  waiver_days: 2
  waiver_type: continual_rolling
  trade_deadline: 2027-03-04

season:
  nba_season: 2026             # BallDontLie numbering: start year (2026 = 2026-27)
  first_game_date: 2026-10-20
  playoff_teams: 6
  playoff_weeks: [20, 21, 22]
  playoffs_end: 2027-04-04
  eliminated_teams_lock: true
  # Fantasy weeks run Monday-Sunday. Playoff weeks 20-22 (Mar 15 - Apr 4) follow from the
  # league settings. Weeks 1-19 must cover Oct 20 - Mar 14 (21 calendar weeks), so two of
  # them are extended. That is ASSUMED below (week 1 runs two weeks; the All-Star week is
  # merged) until confirmed from the Yahoo league schedule. See DECISIONS.md.
  week_boundaries_verified: false
  extended_weeks:              # week number -> number of calendar weeks it spans
    1: 2
    17: 2
  nba_cup_knockout: {start: 2026-12-04, end: 2026-12-11}
  all_star_break: {start: 2027-02-12, end: 2027-02-17}   # ASSUMED; verify when NBA confirms
  light_day_max_games: 5       # a day with <= this many NBA games is a "light day"

draft:
  type: live_standard_snake
  starts_at: "2026-10-18T19:00:00-04:00"
  pick_clock_seconds: 60
  my_slot: null                # [DRAFT SLOT] - fill in once Yahoo assigns order (or set order)
  order: []                    # Yahoo team ids by draft slot, e.g. [7, 3, 11, ...]; names the
                               # board's columns from teams.csv and sets my_slot (team 11's place)
  keepers: []                  # [{team_id, round, player_id | player}] once declared
  confirmed:                   # flip each to true once checked in Yahoo (make doctor flags the rest)
    rounds: false
    keepers: false
    listener: false            # Tampermonkey listener read a Yahoo mock draft correctly
  readiness:                   # make doctor thresholds
    yahoo_eligibility_min_share: 0.9   # of the top pool_size players by value
    board_refresh_budget_ms: 500
    api_url: http://127.0.0.1:8765
  rounds: 12                   # ASSUMED: one per non-IL roster slot (10 starters + 2 bench); check in Yahoo
  pool_size: 200               # z-scores are computed over the top N by value
  tiers: 16                    # natural-break tiers across the top pool (1-D optimal clustering)
  position_eligibility:        # Basketball Monster primary position -> Yahoo slots it can fill,
    PG: [PG, G, Util]          # used until a Yahoo players.csv supplies real eligibility
    SG: [SG, G, Util]
    SF: [SF, F, Util]
    PF: [PF, F, Util]
    C:  [C, Util]
  projection_blend:            # per-game rates; weights must sum to 1.0
    external: 0.75             # Basketball Monster preseason projection
    last_season: 0.25          # player's own 2025-26 per-game rates
    min_last_season_games: 20  # below this, the external projection is used alone
  sd_prior_games: 20           # shrink a player's per-game sd toward the league CV by this many games
  adp:                         # availability = P(still on the board at a given pick)
    sd_base_picks: 4.0         # ADP uncertainty in round 1, in picks
    sd_per_round: 1.5          # added uncertainty per round
    fallback_sd_multiplier: 2.0  # for players ranked without any ADP
  board:
    recommendations: 10        # rows in the top list
    monte_carlo_top: 5         # re-check the top N by simulation
    monte_carlo_draws: 5000
    need_shift_picks: 3.0      # a player whose position every team picking before you still needs
                               # is expected this many picks earlier than his ADP (scaled by share)
    punt_drift_after_round: 3
    punt_drift_p: 0.30         # flag an un-punted category your build wins less often than this
    edge_p: 0.55               # pick insights: a category is "your edge" at >= this P(win), and
                               # "their edge" at <= 1 - this

features:                      # chosen from 2024-26 data: see DECISIONS.md (Phase 1)
  ewma_halflife_minutes: 3     # minutes react fast (relative MAE 0.184 at 3 vs 0.198 at 20)
  ewma_halflife_rates: 15      # per-minute rates want a long memory (plateau 12-20)
  ewma_min_periods: 5          # fewer prior games than this -> feature is missing, not guessed
  rolling_windows: [3, 5, 10]
  rotation_minutes: 20         # a teammate with EWMA minutes >= this is "rotation" for usage-out

overrides:
  # P(plays) by injury status. Doubtful / Questionable / Probable: how often players with that
  # status on the NBA's 5 PM (or pre-tip noon) injury report played, 2024-25 and 2025-26 pooled
  # (DECISIONS.md, teammates out): 1.8% of 632, 49% of 3,612, 91% of 1,304. Day-To-Day
  # (BallDontLie's word) is not on the official report and stays assumed. A manual entry or an
  # explicit play_prob wins.
  status_play_prob:
    "Out": 0.0
    "Out For Season": 0.0
    "Doubtful": 0.02
    "Questionable": 0.49
    "Day-To-Day": 0.6
    "Probable": 0.91
    "Available": 1.0
  # With no return date, a status applies for this many days after the report (inclusive).
  no_return_date_days:
    "Out": 7
    "Doubtful": 1
    "Questionable": 1
    "Day-To-Day": 2
    "Probable": 1
    "Available": 1
  # Authority, highest first. Manual entries (overrides.yaml) outrank everything. The NBA's own
  # injury report sits below team accounts and insiders (whose later posts carry late scratches)
  # and above beat writers, aggregators and BallDontLie's list.
  authority: [manual, official, insider, nba_report, beat, aggregator, bdl]
  # A rotation player (EWMA minutes >= baseline.teammates.rotation_minutes) missing from his
  # team's filed NBA injury report: how often he played, by his recent play rate, 2024-25
  # (DECISIONS.md, teammates out). Bins are upper edges of the play rate.
  unlisted:
    play_rate_bins: [0.3, 0.6, 0.8, 0.95]
    probs: [0.47, 0.77, 0.89, 0.965, 0.983]

baseline:
  preseason_prior_games: 10    # in-season EWMA vs the preseason projection: weight = n / (n + this)
  min_play_prob: 0.0           # floor on P(plays) from the play-rate EWMA (overrides can set 0)
  minutes_recalibration: false # expected minutes (x P(plays)) regressed toward the mean. Fixes stars'
                               # minutes bias but made weekly odds worse in the backtest (DECISIONS.md)
  shrinkage:                   # pull noisy per-minute rates toward the league average (empirical Bayes)
    enabled: false             # turned on only if it beats the unshrunk baseline (DECISIONS.md)
    k_grid_minutes: [0, 60, 120, 250, 500, 1000, 2000, 4000]   # prior strength searched per stat
  teammates:                   # minutes and production shift to teammates when rotation players sit
    enabled: true              # wins with game-day news, neutral without (DECISIONS.md, teammates out)
    rotation_minutes: 12       # a teammate with EWMA minutes >= this counts when he sits
    clip_minutes: 60           # missing-minutes change beyond this is treated as this
    clip_share: 0.6            # missing-production share change beyond this is treated as this

models:                        # Phase 3 challengers (projections/*.py); each must beat the baseline first
  driver: baseline             # which model writes the nightly projections: baseline | lgbm
  shadow: [ensemble]           # project next to the driver, graded live, never used (shadow.py)
  lgbm:                        # gradient-boosted corrections to minutes and per-minute rates
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 200
    subsample: 0.8
    colsample_bytree: 0.8
    min_rate_minutes: 8        # per-minute targets only from games with at least this many minutes
  ridge:                       # the same frame, a linear learner (projections/ridge.py)
    alpha: 10
  catboost:                    # the same frame, CatBoost (projections/catboost_model.py)
    iterations: 400
    depth: 6
    learning_rate: 0.05
    l2_leaf_reg: 5
  hier:                        # per-minute rates pulled toward the player's position (projections/hier.py)
    k_grid_minutes: [0, 60, 120, 250, 500, 1000, 2000]
  ensemble:                    # inverse-error blend of the members (projections/ensemble.py)
    members: [baseline, lgbm, ridge, catboost, hier]
    min_weight: 0.05           # every member keeps at least 5% per stat

optimizer:                     # weekly add/drop plan (research_room/optimizer.py)
  candidate_pool: 40           # free agents considered, the most valuable this week under the current weights
  add_takes_effect_days: 1     # an add made today counts from tomorrow (today's games may have tipped)
  min_gain_per_acquisition: 0.002   # spend an acquisition only for >= 0.2 pts of P(win week)
  relinearize_iterations: 3    # re-weight at the plan and re-solve; the best exact P(win week) wins
  solver_time_limit_s: 20
  saved_plan_hours: 2          # pre-game runs re-save the plan (reading every free agent) at most this often

backtest:                      # replay of a past season (research_room/backtest.py, make backtest)
  teams: 14                    # simulated league: snake draft on season-start projected value
  roster_size: 12              # non-IL roster spots
  max_weeks: 20                # Monday-Sunday weeks from the season's first Monday
  matchups_per_week: 7         # head-to-heads per week (7 = all of them; each runs the optimizer)
  react_to_absences: true      # daily lineups swap in a bench player for a starter who sits (as a manager would)
  seed: 7
  plan_hour_et: 12             # the week's add/drop plan is made the Sunday before, at noon Eastern
  decision_hour_et: 17.5       # news replay: each day's odds, lineups and re-plans at 5:30 PM Eastern

simulation:                    # team-week variance calibration (research_room/calibration.py)
  calibration_teams: 6000      # random teams sampled per season to fit / score the multipliers
  team_size: 10                # players per sampled team (one active lineup)
  team_pool: 180               # sampled from the top N players by projected points that week
  game_final_hours: 3          # a day's Yahoo totals are complete this long after its last tip
  multiplier_bounds: [0.5, 3.0]   # a fitted multiplier outside this is clipped (and flagged)
  min_players_per_week: 200    # skip weeks with fewer projected players (season edges)
  week_draws: 1000             # correlated category draws per P(win week) (shared across the path)
  path_draws: 2000             # simulated weeks for the do-nothing path and its band
  seed: 1

system:                        # health-check freshness budgets, in hours
  freshness_hours:
    bdl_sync: 30               # nightly at 18:30 -> a missed night turns this yellow
    injuries: 30
    nba_report: 30             # the NBA's official injury report (checked once the season starts)
    odds: 30
    projections: 30
    yahoo_roster: 48           # only checked once a roster snapshot is expected (after the draft)
    preseason_projections: 168 # refresh Basketball Monster exports within a week of the draft
    markets: 30                # Kalshi / sportsbook lines archive (only checked once games are on the schedule)
  failed_job_lookback_days: 7

paths:
  db: data/research_room.duckdb
  parquet_dir: data/parquet
  inbox_dir: data/inbox

bdl:
  base_url: https://api.balldontlie.io
  requests_per_minute: 540     # GOAT plan allows 600; keep 10% headroom
  per_page: 100
  backfill_seasons: [2023, 2024, 2025]
  timeout_seconds: 30
  max_retries: 5

markets:                       # betting-market inputs (ingest/kalshi.py, ingest/rundown.py), archived nightly
  # Pre-game runs poll every 15 minutes on game days; the markets (TheRundown bills by use) are pulled
  # at most this often, and always once in the final minutes before the day's first tip.
  pregame_every_minutes: 60
  pregame_final_minutes: 45
  kalshi:                      # public market data, no key
    base_url: https://api.elections.kalshi.com/trade-api/v2
    prop_series: {KXNBAPTS: pts, KXNBAREB: reb, KXNBAAST: ast, KXNBA3PT: fg3m, KXNBASTL: stl, KXNBABLK: blk, KXNBAFTM: ftm}
    game_series: KXNBAGAME
    min_volume: 100            # contracts traded; a thinner rung keeps its quotes but no probability
    max_spread: 0.10           # yes ask - yes bid (dollars); wider = illiquid, no probability
    requests_per_second: 8
  overlay:                     # market-informed projections (projections/market.py)
    enabled: true
    stats: [pts, reb, ast]     # tested 2026-10-05: the market beat the baseline here (threes tied; others untested)
    sd_bounds: [0.5, 2.0]      # market spread kept within these multiples of the baseline's
    max_age_hours: 30          # ignore ladders older than this
  rundown:                     # sportsbook lines + player props (RUNDOWN_API_KEY)
    base_url: https://therundown.io/api/v2
    sport_id: 4
    prop_markets: {29: pts, 35: reb, 39: ast, 38: fg3m, 34: stl, 98: blk, 33: tov}
    game_markets: {1: moneyline, 2: spread, 3: total}
    days_ahead: 2              # today plus this many days of events per nightly run
    pregame_days_ahead: 0      # pre-game pulls: today's games only
    requests_per_second: 5

alerts:                        # in-app notifications (research_room/alerts.py, League bell)
  lookback_days: 14            # how far back the inbox shows
  waiver_min_gain: 0.02        # add/drop alert only when the move adds at least 2 pts of P(win week)
  lock_window_hours: 3         # lineup-lock reminder only in the 3 hours before the first lock

scorecard:                     # in-season checks (scorecard.py); the rules are in DECISIONS.md,
                               # "In-season scorecard", written before opening night. Pairs: watch, act.
  min_player_games: 2000       # per stat, before the error and band checks count
  # The baseline on 2025-26 with no game-day news (make bakeoff, 2026-10-08). Live projections have
  # the news, so their errors should be at or below these.
  reference_mae: {minutes: 6.291, pts: 4.200, reb: 1.678, ast: 1.127, stl: 0.529, blk: 0.361,
                  fg3m: 0.685, tov: 0.703, fga: 2.816, fta: 1.257}
  # Share of outcomes inside the 80% band then. Small whole-number stats sit above 0.80 by
  # construction (a 0-or-1 block game is inside a band of 0.2-0.9), so each stat has its own.
  reference_coverage: {minutes: 0.816, pts: 0.839, reb: 0.851, ast: 0.870, stl: 0.899, blk: 0.908,
                       fg3m: 0.895, tov: 0.881, fga: 0.826, fta: 0.888}
  mae_ratio: [1.05, 1.10]      # live average miss over the reference
  bias_share: [0.10, 0.20]     # |lean| as a share of the reference average miss
  coverage_gap: [0.04, 0.07]   # |live band coverage - reference|
  p_play_bias: [0.03, 0.05]    # |mean P(plays) - share who played|
  min_listed: 30               # per news source and status, before its played rate counts
  status_gap: [0.10, 0.15]     # |played rate - the P(plays) we assume for that status|
  min_weeks: 15                # one result a week (my matchup): too few to judge before this
  weekly_brier: [0.22, 0.25]   # 0.25 is a coin flip; the backtest's was 0.187

x_forward_test:                # the X forward test (make x-forward-test); the rule is in DECISIONS.md,
                               # "In-season scorecard and the forward tests", written before opening night
  min_weeks: 3                 # no verdict before the replayed game days span 3 weeks ...
  min_statuses: 150            # ... and hold 150 X statuses tied to a game
  draws: 2000                  # resamples of whole game days for each 95% range
  level: 0.95
  seed: 0

nba_report:                    # the NBA's official injury report (ingest/nba_injury_report.py)
  base_url: https://ak-static.cms.nba.com/referee/injury/
  lookback_minutes: 180        # look this far back for the newest published report
  step_minutes: 15             # reports are named by their publishing slot
  requests_per_second: 2

x_feed:                        # injury / lineup news from config/x_accounts.yaml (ingest/x_feed.py)
  daily_read_budget: 300       # posts read per day (X is pay-per-use); polling stops at the cap
  base_url: https://api.x.com/2
  max_query_chars: 512         # X recent-search query length limit
  poll_minutes: 15             # pre-game cadence (make pregame-schedule)
  window_hours_before_tip: 3   # polling starts this long before the day's first tip
  catchup_hours: 20            # an account read for the first time (or after a long gap): this far back
  overlap_minutes: 2           # each read re-covers this much before the last one (late-indexed posts)
  max_pages_per_query: 5       # result pages followed per query and poll (100 posts each)
  llm_model: claude-haiku-4-5-20251001   # small model that turns posts into status events
  # 40 posts per call cut the model's answer off at its output limit and lost the whole batch
  # (round-3 audit test, all three runs). A cut-off call is split in half and retried.
  max_posts_per_llm_call: 10
  llm_max_tokens: 4000
  min_confidence: 0.5          # the model's own confidence below this: the status is not used
