# League and app settings. Secrets live in .env, never here.

league:
  name: Hoop Dreams
  platform: yahoo
  league_id: 79805
  my_team_id: 11
  teams: 14
  public: false
  format: h2h_one_win          # one W or L per week: majority of the 9 categories

categories:                    # higher_is_better: false means fewer wins the category
  - {key: fg_pct, label: FG%,  kind: pct,   made: fgm,  attempts: fga, higher_is_better: true}
  - {key: ft_pct, label: FT%,  kind: pct,   made: ftm,  attempts: fta, higher_is_better: true}
  - {key: fg3m,   label: 3PTM, kind: count, higher_is_better: true}
  - {key: pts,    label: PTS,  kind: count, higher_is_better: true}
  - {key: reb,    label: REB,  kind: count, higher_is_better: true}
  - {key: ast,    label: AST,  kind: count, higher_is_better: true}
  - {key: stl,    label: ST,   kind: count, higher_is_better: true}
  - {key: blk,    label: BLK,  kind: count, higher_is_better: true}
  - {key: tov,    label: TO,   kind: count, higher_is_better: false}

roster:
  slots: [PG, SG, G, SF, PF, F, C, C, Util, Util, BN, BN, BN, IL]
  active_per_day: 10
  bench: 3
  il: 1
  il_direct_add: true          # injured free agents may go straight to IL
  lock: daily_at_game_time     # bench players are not locked

transactions:
  max_acquisitions_per_week: 4
  season_max_acquisitions: null
  waiver_days: 2
  waiver_type: continual_rolling
  trade_deadline: 2027-03-04

season:
  nba_season: 2026             # BallDontLie numbering: start year (2026 = 2026-27)
  first_game_date: 2026-10-20
  playoff_teams: 6
  playoff_weeks: [20, 21, 22]
  playoffs_end: 2027-04-04
  eliminated_teams_lock: true
  # Fantasy weeks run Monday-Sunday. Playoff weeks 20-22 (Mar 15 - Apr 4) follow from the
  # league settings. Weeks 1-19 must cover Oct 20 - Mar 14 (21 calendar weeks), so two of
  # them are extended. That is ASSUMED below (week 1 runs two weeks; the All-Star week is
  # merged) until confirmed from the Yahoo league schedule. See DECISIONS.md.
  week_boundaries_verified: false
  extended_weeks:              # week number -> number of calendar weeks it spans
    1: 2
    17: 2
  nba_cup_knockout: {start: 2026-12-04, end: 2026-12-11}
  all_star_break: {start: 2027-02-12, end: 2027-02-17}   # ASSUMED; verify when NBA confirms
  light_day_max_games: 5       # a day with <= this many NBA games is a "light day"

draft:
  type: live_standard_snake
  starts_at: "2026-10-18T19:00:00-04:00"
  pick_clock_seconds: 60
  my_slot: null                # [DRAFT SLOT] - fill in once Yahoo assigns order
  keepers: []                  # [{team_id, player_id, round}] once declared
  rounds: 13                   # ASSUMED: one per non-IL roster slot; confirm in Yahoo draft settings
  pool_size: 200               # z-scores are computed over the top N by value
  tiers: 16                    # natural-break tiers across the top pool (1-D optimal clustering)
  position_eligibility:        # Basketball Monster primary position -> Yahoo slots it can fill,
    PG: [PG, G, Util]          # used until a Yahoo players.csv supplies real eligibility
    SG: [SG, G, Util]
    SF: [SF, F, Util]
    PF: [PF, F, Util]
    C:  [C, Util]
  projection_blend:            # per-game rates; weights must sum to 1.0
    external: 0.75             # Basketball Monster preseason projection
    last_season: 0.25          # player's own 2025-26 per-game rates
    min_last_season_games: 20  # below this, the external projection is used alone
  sd_prior_games: 20           # shrink a player's per-game sd toward the league CV by this many games
  adp:                         # availability = P(still on the board at a given pick)
    sd_base_picks: 4.0         # ADP uncertainty in round 1, in picks
    sd_per_round: 1.5          # added uncertainty per round
    fallback_sd_multiplier: 2.0  # for players ranked without any ADP
  board:
    recommendations: 10        # rows in the top list
    monte_carlo_top: 5         # re-check the top N by simulation
    monte_carlo_draws: 5000
    need_shift_picks: 3.0      # a player whose position every team picking before you still needs
                               # is expected this many picks earlier than his ADP (scaled by share)
    punt_drift_after_round: 3
    punt_drift_p: 0.30         # flag an un-punted category your build wins less often than this
    edge_p: 0.55               # pick insights: a category is "your edge" at >= this P(win), and
                               # "their edge" at <= 1 - this

features:                      # chosen from 2024-26 data: see DECISIONS.md (Phase 1)
  ewma_halflife_minutes: 3     # minutes react fast (relative MAE 0.184 at 3 vs 0.198 at 20)
  ewma_halflife_rates: 15      # per-minute rates want a long memory (plateau 12-20)
  ewma_min_periods: 5          # fewer prior games than this -> feature is missing, not guessed
  rolling_windows: [3, 5, 10]
  rotation_minutes: 20         # a teammate with EWMA minutes >= this is "rotation" for usage-out

overrides:
  # P(plays) by injury status. ASSUMED (no injury history yet to calibrate against); revisit once
  # a few weeks of reports and outcomes are archived. A manual entry or an explicit play_prob wins.
  status_play_prob:
    "Out": 0.0
    "Out For Season": 0.0
    "Doubtful": 0.25
    "Questionable": 0.5
    "Day-To-Day": 0.6
    "Probable": 0.85
    "Available": 1.0
  # With no return date, a status applies for this many days after the report (inclusive).
  no_return_date_days:
    "Out": 7
    "Doubtful": 1
    "Questionable": 1
    "Day-To-Day": 2
    "Probable": 1
    "Available": 1
  # Authority, highest first. Manual entries (overrides.yaml) outrank everything.
  authority: [manual, official, insider, beat, aggregator, bdl]

baseline:
  preseason_prior_games: 10    # in-season EWMA vs the preseason projection: weight = n / (n + this)
  min_play_prob: 0.0           # floor on P(plays) from the play-rate EWMA (overrides can set 0)

system:                        # health-check freshness budgets, in hours
  freshness_hours:
    bdl_sync: 30               # nightly at 18:30 -> a missed night turns this yellow
    injuries: 30
    odds: 30
    projections: 30
    yahoo_roster: 48           # only checked once a roster snapshot is expected (after the draft)
    preseason_projections: 168 # refresh Basketball Monster exports within a week of the draft
  failed_job_lookback_days: 7

paths:
  db: data/research_room.duckdb
  parquet_dir: data/parquet
  inbox_dir: data/inbox

bdl:
  base_url: https://api.balldontlie.io
  requests_per_minute: 540     # GOAT plan allows 600; keep 10% headroom
  per_page: 100
  backfill_seasons: [2023, 2024, 2025]
  timeout_seconds: 30
  max_retries: 5

x_feed:
  daily_read_budget: 300
