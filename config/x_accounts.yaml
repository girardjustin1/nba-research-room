# Curated X accounts for the injury / status / starting-lineup feed (Phase 3).
#
# tier (authority, highest first):
#   official   - team and league accounts: injury reports, starting lineups. Outrank everything.
#   insider    - national reporters who break injury and rotation news first.
#   aggregator - injury/lineup aggregators; fast, but secondhand.
#   beat       - team beat reporters: practice reports, minutes limits, lineups.
#
# Approved by the owner 2026-10-04: keep every account (no removals). Verified 2026-10-05 with X's
# users-by-username lookup: 122 of 131 exist (`verified: true` + the stable X `user_id`); 9 failed
# (`lookup: not_found` or `restricted`) and are skipped by the feed until a correct handle is found.
# Where two research passes disagree on a handle (e.g. UnderdogNBA vs Underdog__NBA), both stay
# until that lookup settles it.
#
# Provenance: pass 1 (deep research) gave handles only - its evidence links were fabricated and
# were discarded. Pass 2 added `outlet`, `seen` (last month the research saw the account active)
# and `evidence` post links whose ids decode to dates consistent with `seen` (not opened: X needs
# a login). `seen: 2025-10` means from a 2025 directory, seat not re-confirmed after the 2026
# offseason. Pass 3 reported its links as resolving: those entries carry `links_resolved: true`
# and a day-level `seen`. `verified` still means "confirmed by our own X lookup" (Phase 3).
#
# Budget: settings.yaml caps reads at 300/day. Phase 3 reads all accounts through one private
# X list (one request per poll), counts posts read against the budget, and on game days may watch
# beat reporters only for teams playing that night.

