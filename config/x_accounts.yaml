# Curated X accounts for the injury / status / starting-lineup feed (Phase 3).
#
# tier (authority, highest first):
#   official   - team accounts: injury reports, starting lineups. Outrank everything.
#   insider    - national reporters who break injury and rotation news first.
#   beat       - team beat reporters: practice reports, minutes limits, lineups.
#   aggregator - injury/lineup aggregators; fast, but secondhand.
#
# Approved by the owner 2026-10-04: keep every account below. Every handle is `verified: false` until Phase 3 confirms it
# with one X users-by-username lookup (100 handles per request). Beat writers change outlets
# and handles often, so that lookup matters most for them.
#
# Budget note: settings.yaml caps reads at 300/day. With ~100 accounts, polling each separately
# is impossible; Phase 3 reads them through one private X list (one request per poll), counts
# posts read against the budget, and may need to poll beat accounts only for teams playing
# that day.

