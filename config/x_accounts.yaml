# Curated X accounts for the injury / status / starting-lineup feed (Phase 3).
#
# tier (authority, highest first):
#   official   - team accounts: injury reports, starting lineups. Outrank everything.
#   insider    - national reporters who break injury and rotation news first.
#   aggregator - injury/lineup aggregators; fast, but secondhand.
#
# Approved by the owner 2026-10-04: keep every account below. Every handle is `verified: false` until Phase 3 confirms it
# with one X users-by-username lookup (100 handles per request). Beat writers are left out on
# purpose: they change outlets and handles often; add any you trust with tier: beat.
#
# Budget note: settings.yaml caps reads at 300/day. Polling 40 accounts separately every
# 15 minutes for 3 hours would be 480 requests, so Phase 3 should read them through one private
# X list (one request per poll) and count posts read against the budget.

