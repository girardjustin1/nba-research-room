# Cross-source player name mapping. One entry per real player whose name differs
# between sources. `player_id` is the BallDontLie id (preferred: it is unambiguous);
# `name` is the canonical BDL full name. Matching is accent-, case-, punctuation- and
# suffix-insensitive already, so only list genuine differences (nicknames, transliterations,
# a source dropping a middle name). Ambiguous matches are never merged: they go to the
# quarantine table (`unresolved_names`) and show on the Data page; add an entry here to fix one.
#
# Example:
#   - name: Herbert Jones
#     player_id: null
#     variants: [Herb Jones]

aliases:
  # Nicknames used by Basketball Monster / Yahoo (found 2026-10-04). Keyed by BDL id.
  - {name: Carlton Carrington, player_id: 1028025235, variants: [Bub Carrington]}
  - {name: Airious Bailey,     player_id: 1057260888, variants: [Ace Bailey]}
  - {name: Luguentz Dort,      player_id: 666541,     variants: [Lu Dort]}
  - {name: Nah'Shon Hyland,    player_id: 17896031,   variants: [Bones Hyland]}
  - {name: Ronald Holland II,  player_id: 1028026508, variants: [Ron Holland]}
  - {name: Cameron Johnson,    player_id: 666679,     variants: [Cam Johnson]}
  - {name: Herbert Jones,      player_id: 17896024,   variants: [Herb Jones]}
  - {name: Hansen Yang,        player_id: 1057275769, variants: [Yang Hansen]}
  - {name: David Jones,        player_id: 1028245237, variants: [David Jones Garcia, David Jones-Garcia]}
  - {name: Elijah Harkless,    player_id: 1028264794, variants: [EJ Harkless]}
  # Kalshi prop markets (found 2026-10-05).
  - {name: Nicolas Claxton,    player_id: 666508,     variants: [Nic Claxton]}
  - {name: Alexandre Sarr,     player_id: 1028028405, variants: [Alex Sarr]}

# Other sources' team abbreviations -> BallDontLie abbreviations. Used to break ties
# between players who share a name. Yahoo's short forms are listed; extend as needed.
team_aliases:            # keys quoted: YAML would read a bare NO as boolean false
  "GS": GSW
  "NO": NOP
  "NY": NYK
  "SA": SAS
  "PHO": PHX
  "UTAH": UTA
  "NOR": NOP               # Basketball Monster
