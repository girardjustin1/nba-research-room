[project]
name = "research-room"
version = "0.1.0"
description = "NBA Research Room: personal fantasy basketball draft board, projections, lineup optimizer and H2H simulator."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "balldontlie==0.1.6",
    "yahoo_fantasy_api==2.12.3",
    "yahoo_oauth==2.1.1",
    "tweepy==4.17.0",
    "requests==2.34.2",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "duckdb==1.5.6",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
    "xgboost==3.4.1",
    "shap==0.52.0",
    "pulp==4.0.0",
    "streamlit==1.65.0",
    "plotly==7.1.0",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "apscheduler==3.11.3",
    "anthropic==1.11.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_room"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
