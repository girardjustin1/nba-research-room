# Publish Storybook (site root) and the demo-mode app (/app/) to GitHub Pages on every push that
# changes web/. Public: anyone with the link can view it. Both use invented sample data only; no
# projections, keys or league data are in either build. The app's live data never leaves the Mac.
name: Storybook + demo app → GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/storybook-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
      - run: pnpm build:demo
      - name: Assemble site (Storybook at /, demo app at /app/)
        run: |
          rm -rf ../site && mkdir -p ../site/app
          cp -R storybook-static/. ../site/
          cp -R dist-demo/. ../site/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
