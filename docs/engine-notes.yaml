# Updates from Claude, shown on the app's System → Updates screen (newest first there).
# kind: update | finding | recommendation | warning. Plain text or light markdown; no raw HTML.
# Public repo: never put Basketball Monster numbers, secrets or personal data here.

notes:
  - id: 2026-10-05-live-calibration
    date: 2026-10-05
    kind: finding
    title: Weekly odds now account for surprise absences
    body: >
      The weekly spreads were fitted only on games players actually played, so injuries nobody
      saw coming were missing. Refitted the way the tool really works (each Monday's projections
      against every scheduled game, missed games counting zero), the spreads are wider: points
      about 2x, rebounds 1.9x. Checked on 140 head-to-heads from last season, win chances are now
      honest up to 90%. Only the most lopsided weeks still run a bit hot (95% predicted, 81% won).
      That last bit comes from rosters built on optimistic projections, which the next projection
      models will fix.
    refs: [DECISIONS.md, src/research_room/calibration.py]

  - id: 2026-10-05-backtest
    date: 2026-10-05
    kind: finding
    title: Backtest of 2025-26 - plans help a lot, top-end odds run hot
    body: >
      Replayed 80 head-to-head weeks of last season in a simulated 14-team league, using only what
      was known each Monday. Following the add/drop plan won 90% of weeks against 48% doing nothing,
      but the opponent never streamed, so treat that as a ceiling. The engine's win chances are fair
      in the middle (50% predicted, 44% won) but too confident at the top (93% predicted, 76% won).
      Next fix: calibrate the weekly spreads the same live way, so injuries nobody saw coming are
      counted. A first version of the backtest leaked who would be available; it is fixed and
      tested.
    refs: [DECISIONS.md, src/research_room/backtest.py]

  - id: 2026-10-05-optimizer
    date: 2026-10-05
    kind: update
    title: The weekly add/drop plan is built
    body: >
      Each week the engine searches your free agents for the adds (and drops) that raise your
      chance of winning the week the most, within 4 acquisitions, your roster spots and the
      10 active slots. Every move is scored by the matchup engine. It drives the With moves line
      on the Matchup chart, the Moves tab, and toggling moves on and off. It needs players.csv for
      the free agents; add an acquisitions_used column to matchup.csv so it knows how many adds
      you have left (until then it assumes none used and says so).
    refs: [DECISIONS.md, src/research_room/optimizer.py]

  - id: 2026-10-05-matchup
    date: 2026-10-05
    kind: update
    title: The matchup engine is built; it switches on with week 1
    body: >
      Your weekly win probability now comes from both real rosters, each player's games, the
      10-active daily limit and Yahoo's live totals. Tested on 5,000 past head-to-head weeks:
      treating the nine categories as independent made week odds too confident (85% predicted
      won 78% of the time), so categories are now drawn together, as they really move (points,
      threes and makes rise together). Predicted 85% now wins 82%. It needs the week's
      matchup.csv and every team's roster.csv; until then the Matchup tab says so.
    refs: [DECISIONS.md, src/research_room/matchup.py]

  - id: 2026-10-04-calibration
    date: 2026-10-04
    kind: finding
    title: Weekly win probabilities were too confident; fixed
    body: >
      Checked on all of 2025-26 out of sample, a 10-player team's weekly totals landed inside the
      80% range only 66-81% of the time (points 66%), so category win chances were too sure of
      themselves. Two fixes: projections now include uncertainty in minutes, and each category's
      weekly spread is calibrated on earlier seasons. All nine categories now land at 78-81%.
      The Models tab shows it as baseline_team_week.
    refs: [DECISIONS.md, src/research_room/calibration.py]

  - id: 2026-10-04-readiness
    date: 2026-10-04
    kind: recommendation
    title: Run make doctor in draft week
    body: >
      The draft board now uses Yahoo's multi-position eligibility once players.csv is in the inbox.
      Until then each player has only his Basketball Monster position, and the player sheet says
      so. `make doctor` lists everything still missing before Oct 18 (fresh projections, Yahoo
      eligibility, slot, rounds, keepers, the listener test), each with its fix. The step-by-step
      plan for the night is in docs/draft-night.md.
    refs: [docs/draft-night.md, src/research_room/readiness.py]

  - id: 2026-10-04-baseline
    date: 2026-10-04
    kind: update
    title: Baseline projections are live and calibrated
    body: >
      Projections now come from recent per-minute production x expected minutes x chance of playing.
      Scored on all of 2025-26 out of sample, they are unbiased (points off by +0.04 on average) and
      their ranges are honest: 70% of point totals land inside the projected ±1 sd band, against 68%
      expected. Every future model has to beat this on the Models tab before it is used.
    refs: [DECISIONS.md#phase-1, src/research_room/projections/baseline.py]

  - id: 2026-10-04-carryover
    date: 2026-10-04
    kind: finding
    title: Last season's rest days were leaking into October
    body: >
      Teams rested starters in April, so some stars entered this season looking unlikely to play
      (Jokic projected low). Early in the season, the chance of playing now leans on the preseason
      games estimate and shifts to this season's own record as games are played.
    refs: [src/research_room/projections/baseline.py]

  - id: 2026-10-04-odds
    date: 2026-10-04
    kind: warning
    title: No betting-line history exists yet
    body: >
      BallDontLie keeps no past odds, despite its docs. Lines are archived from the first nightly run
      onward, so spread and total features are missing (and confidence lower) until history builds.
      Start `make nightly-schedule` before the season.
    refs: [DECISIONS.md#phase-0]

  - id: 2026-10-04-board-fixes
    date: 2026-10-04
    kind: finding
    title: The draft board stacked centers; fixed
    body: >
      A timed mock draft showed the board taking five centers and raising false punt warnings. Players
      without an open starting slot now count as bench players (they play only when a starter rests),
      and punt warnings use the full projected roster. Re-run mocks now draft balanced rosters.
    refs: [src/research_room/draft/board.py, jobs/mock_draft.py]

  - id: 2026-10-04-listener
    date: 2026-10-04
    kind: recommendation
    title: Test the Yahoo pick listener in a mock draft before Oct 18
    body: >
      The Tampermonkey listener has only been tested against a local imitation of the draft room.
      Join a Yahoo mock draft, start a throwaway draft id (for example `yahoo-mock-1`), and check the
      badge reads every pick. Manual entry always works if it doesn't.
    refs: [scripts/draft_listener.user.js, README.md]

  - id: 2026-10-04-assumptions
    date: 2026-10-04
    kind: recommendation
    title: Three league facts still need confirming
    body: >
      Draft rounds (assumed 12: Yahoo's roster has 2 bench spots, not 3), fantasy week boundaries for weeks 1-19 (assumed: week 1 and the
      All-Star week are double weeks), and keepers. Each is a setting in config/settings.yaml.
    refs: [config/settings.yaml]
